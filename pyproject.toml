[project]
name = "scansort"
dynamic = ["version"]
description = "Intelligent automated desktop document filer powered by Google Gemini"
readme = "README.md"
authors = [
    { name = "Stephen Wong" }
]
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.22.0",
    "img2pdf>=0.6.3",
    "keyring>=25.7.0",
    "pillow>=12.3.0",
    "pydantic>=2.0",
    "pypdf>=6.16.2",
    "pystray>=0.19.5",
    "tzdata>=2026.3",
    "watchfiles>=1.2.0",
]

[project.scripts]
scansort = "scansort.__main__:main_cli"

[project.optional-dependencies]
windows = [
    "windows-toasts~=1.3.1; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "scansort/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["scansort"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=scansort --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "DTZ", "BLE"]
ignore = ["E501"]

