[project]
name = "scansort"
dynamic = ["version"]
description = "Intelligent automated desktop document filer powered by Google Gemini"
readme = "README.md"
authors = [
    { name = "Stephen Wong" }
]
license = { text = "MIT" }
requires-python = ">=3.15"
dependencies = [
    "google-genai>=3.3.0",
    "img2pdf>=0.6.3",
    "keyring>=25.7.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pypdf>=7.1.0",
    "pystray>=0.19.5",
    "pytesseract>=0.3.13",
    "tzdata>=2026.6",
    "watchfiles>=1.3.0",
]

[project.scripts]
scansort = "scansort.__main__:main_cli"

[project.optional-dependencies]
windows = [
    "winrt-runtime>=4.1.0; sys_platform == 'win32'",
    "winrt-Windows.Data.Xml.Dom>=4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications>=4!10.0.28000.2957; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "scansort/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["scansort"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=scansort --cov-report=term-missing --cov-fail-under=95"
filterwarnings = [
    "ignore:'_UnionGenericAlias' is deprecated and slated for removal in Python 3.17:DeprecationWarning:google.genai.types",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "DTZ", "BLE"]
ignore = ["E501"]

