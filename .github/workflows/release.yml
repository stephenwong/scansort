name: Release Standalone Windows Executable

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    name: Build Windows ScanSort.exe
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies & build tools
        run: |
          uv sync --all-extras
          uv add --dev pyinstaller

      - name: Install Tesseract OCR engine
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $exe = Get-ChildItem "C:\Program Files\Tesseract-OCR\tesseract.exe", "C:\tools\tesseract\tesseract.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "tesseract.exe not found after install" }
          $dir = $exe.DirectoryName
          "TESSERACT_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $exe --version

      - name: Run test suite
        run: uv run pytest -v

      - name: Build executable via PyInstaller
        run: uv run pyinstaller scansort.spec

      - name: Verify bundled OCR engine
        shell: pwsh
        run: |
          $exeCandidates = @(
            "dist\ScanSort\_internal\tesseract\tesseract.exe",
            "dist\ScanSort\tesseract\tesseract.exe"
          )
          $exe = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "bundled tesseract missing" }
          $langCandidates = @(
            "dist\ScanSort\_internal\tesseract\tessdata\eng.traineddata",
            "dist\ScanSort\tesseract\tessdata\eng.traineddata"
          )
          $lang = $langCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $lang) { throw "bundled eng.traineddata missing" }
          & $exe --version

      - name: Test compiled binary
        shell: pwsh
        run: |
          dist\ScanSort\ScanSort.exe --help
          dist\ScanSort\ScanSort.exe --version
          $ver = (Get-Item dist\ScanSort\ScanSort.exe).VersionInfo.ProductVersion
          Write-Host "Compiled binary ProductVersion: $ver"
          if (-not $ver) { throw "ProductVersion not found in binary metadata" }

      - name: Package Release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\ScanSort\* -DestinationPath ScanSort-${{ github.ref_name }}-windows-x64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ScanSort-${{ github.ref_name }}-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
